name: release

on:
  workflow_dispatch:
  push:
    branches:
    - main
    tags:
        - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test crawler and Emby refresh
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v

  build:
    needs: test
    runs-on: ubuntu-latest
    name: Publish image to GitHub Packages
    permissions:
      contents: read
      packages: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v6

      - 
        name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/xiaoya-emd
          flavor: latest=false
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha

      -
        name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      -
        name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      -
        name: Login GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      -
        name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./pkg/docker/Dockerfile
          platforms: |
            linux/amd64
            linux/arm64/v8
            linux/arm/v7
          build-args: |
            BRANCH=main
            REPO_URL=${{ github.server_url }}/${{ github.repository }}.git
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=release-image
          cache-to: type=gha,mode=max,scope=release-image
        env:
          DOCKER_BUILD_RECORD_UPLOAD: false

      - name: Verify published image
        env:
          IMAGE_REF: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: docker buildx imagetools inspect "$IMAGE_REF"

  Windows-amd64:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    name: Build Windows Binary
    steps:
      - 
        name: Checkout
        uses: actions/checkout@v6

      - 
        name: Init Python 3.13
        uses: actions/setup-python@v6
        with:
            python-version: '3.13'
            cache: 'pip'

      - 
        name: Install Dependent Packages
        run: |
            python -m pip install --upgrade pip
            pip install wheel pyinstaller
            pip install -r requirements.txt
        shell: pwsh

      - 
        name: Pyinstaller
        run: |
            copy .\pkg\solid.spec solid.spec
            pyinstaller solid.spec
        shell: pwsh

      - 
        name: Upload Windows File
        uses: actions/upload-artifact@v6
        with:
            name: solid-windows-amd64
            path: dist/solid.exe

  Linux-glibc-build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["amd64", "arm64"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Package through pyinstaller
        run: |
          mkdir rootfs
          docker buildx build --platform linux/${{ matrix.arch }} --file ./pkg/builder/Dockerfile --output type=local,dest=./rootfs .
          cp ./rootfs/solid ./solid-linux-${{ matrix.arch }}
        shell: pwsh

      - name: Upload linux file
        uses: actions/upload-artifact@v6
        with:
          name: solid-linux-${{ matrix.arch }}
          path: solid-linux-${{ matrix.arch }}

  Linux-musl-build:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: ["amd64", "arm64"]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set Up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Package through pyinstaller
        run: |
          mkdir rootfs
          docker buildx build --platform linux/${{ matrix.arch }} --file ./pkg/builder/alpine.Dockerfile --output type=local,dest=./rootfs .
          cp ./rootfs/solid ./solid-linux-musl-${{ matrix.arch }}
        shell: pwsh

      - name: Upload linux file
        uses: actions/upload-artifact@v6
        with:
          name: solid-linux-musl-${{ matrix.arch }}
          path: solid-linux-musl-${{ matrix.arch }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [ Windows-amd64, Linux-glibc-build, Linux-musl-build, build ]
    steps:
      - 
        name: Checkout
        uses: actions/checkout@v6

      - 
        name: Get version
        id: get_version
        run: |
          echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_ENV

      - 
        name: Download Artifact
        uses: actions/download-artifact@v7

      - 
        name: Rename
        shell: bash
        run: |
            mkdir ./release
            mv ./solid-windows-amd64/solid.exe ./release/solid-windows-amd64.exe
            mv ./solid-linux-amd64/solid-linux-amd64 ./release
            mv ./solid-linux-arm64/solid-linux-arm64 ./release
            mv ./solid-linux-musl-amd64/solid-linux-musl-amd64 ./release
            mv ./solid-linux-musl-arm64/solid-linux-musl-arm64 ./release

      -
        name: Release
        uses: softprops/action-gh-release@v2
        with:
            name: ${{ env.VERSION }}
            tag_name: ${{ env.VERSION }}
            files: |
                ./release/solid-windows-amd64.exe
                ./release/solid-linux-amd64
                ./release/solid-linux-arm64
                ./release/solid-linux-musl-amd64
                ./release/solid-linux-musl-arm64
